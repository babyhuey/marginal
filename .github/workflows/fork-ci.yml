name: Fork CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - run: echo "checked-out SHA $(git rev-parse HEAD)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
